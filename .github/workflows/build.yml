name: APK banao

# Har baar jab aap file upload/change karein, GitHub khud APK bana dega.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code lo
        uses: actions/checkout@v4

      - name: Java 17 lagao
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle lagao
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sirf ek HTML file honi chahiye
        run: |
          test -f dukaan-app.html || { echo "dukaan-app.html repo ki jar (root) mein nahi hai"; exit 1; }
          ls -l dukaan-app.html

      - name: Urdu Nastaliq font laao
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          F=app/src/main/assets/fonts/NotoNastaliqUrdu.ttf
          for U in \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notonastaliqurdu/NotoNastaliqUrdu-Regular.ttf" \
            "https://github.com/notofonts/nastaliq/raw/main/fonts/NotoNastaliqUrdu/hinted/ttf/NotoNastaliqUrdu-Regular.ttf" ; do
            echo "koshish: $U"
            if curl -fsSL "$U" -o "$F" && [ -s "$F" ]; then echo "MIL GAYA"; break; fi
          done
          ls -l app/src/main/assets/fonts/ || echo "FONT NAHI MILA — app phir bhi chalegi"

      # Har build ka versionCode barhta hai (1, 2, 3...) — bilkul Play Store ki tarah.
      # Isi wajah se nayi APK purani ke UPAR update ho jati hai, uninstall ki zaroorat nahi.
      # versionCode kabhi kam nahi hona chahiye, aur run_number hamesha barhta hai.
      - name: APK banao (debug)
        env:
          MD_VC: ${{ github.run_number }}
          MD_VN: 1.0.${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Naam theek karo
        id: name
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/MeriDukaan-v${{ github.run_number }}.apk"
          echo "apk=out/MeriDukaan-v${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          ls -lh out
          du -h out/*.apk

      - name: APK sambhaal ke rakho
        uses: actions/upload-artifact@v4
        with:
          name: MeriDukaan-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Phone par download karne ke liye link banao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk "${{ steps.name.outputs.apk }}" \
            --title "Meri Dukaan — taaza APK (version 1.0.${{ github.run_number }})" \
            --notes "Purani app ke UPAR install karein — uninstall karne ki zaroorat nahi, saara data mehfooz rehta hai. (versionCode ${{ github.run_number }})"
