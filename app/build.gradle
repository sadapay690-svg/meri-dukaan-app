plugins {
    id 'com.android.application'
}

/* Release signing comes from environment variables so that nothing secret
   ever sits in the repo. If they are missing, only the debug APK is built. */
def ksPath  = System.getenv("MD_KS_PATH")
def ksPass  = System.getenv("MD_KS_PASS")
def ksAlias = System.getenv("MD_KEY_ALIAS")
def keyPass = System.getenv("MD_KEY_PASS")
def signOk  = ksPath != null && ksPath.trim() && file(ksPath).exists()

android {
    namespace 'com.bithub.meridukaan'
    compileSdk 34

    defaultConfig {
        applicationId "com.bithub.meridukaan"
        minSdk 23
        targetSdk 34
        versionCode ((System.getenv("MD_VC") ?: "1") as int)
        versionName (System.getenv("MD_VN") ?: "1.0")
        resConfigs "en"

        /* Asli phone sirf ARM hote hain. x86 native libs nikaal dene se
           APK aadha halka ho jata hai aur kisi phone par farq nahi parta. */
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        /* Debug builds are signed with a FIXED key that lives in the repo.
           A debug key is not a secret (Google's own default password is
           "android"), but keeping it fixed is essential: GitHub's runners
           generate a random debug key on every fresh machine, and a changed
           signature makes Android refuse to install the update over the
           previous version — which would force an uninstall and wipe the
           shopkeeper's data. With this file, every cloud build is signed
           identically, so updates install on top and localStorage survives. */
        getByName("debug") {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        if (signOk) {
            create("release") {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.getByName("debug")
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (signOk) {
                signingConfig signingConfigs.getByName("release")
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

/* ---- Kotlin library ka jhagra khatam ----
   ML Kit purani `kotlin-stdlib-jdk8:1.6.21` khinchti hai, CameraX/androidx nayi
   `kotlin-stdlib:1.8.22`. Kotlin 1.8 se jdk7/jdk8 wali classes seedhi
   kotlin-stdlib ke andar aa gayi hain, is liye dono ek saath rakhne par
   `checkDebugDuplicateClasses` "Duplicate class kotlin.*" de kar build tod deta
   hai. Teeno ko 1.8.22 par majboor karne se purani jar sirf ek khali shim reh
   jati hai aur duplicate khatam. */
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'

    /* ComponentActivity = LifecycleOwner, CameraX ko iski zarurat hai */
    implementation 'androidx.activity:activity:1.9.0'

    /* Camera preview + frame analysis */
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    /* Barcode model APK ke andar (offline). Yehi ~7 MB size ki wajah hai,
       magar iske bina WebView mein barcode scan bilkul kaam nahi karta. */
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}

/* The app itself is ONE html file kept at the repo root.
   Copy it into assets before every build so there is only one file to update. */
tasks.register('copyApp', Copy) {
    from file("$rootDir/dukaan-app.html")
    into file("$projectDir/src/main/assets")
    rename { 'index.html' }
}

tasks.named('preBuild') {
    dependsOn tasks.named('copyApp')
}
